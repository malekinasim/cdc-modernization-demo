services:
  order-database:
    image: postgres:17
    container_name: order-database
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${ORDER_DB}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}

    volumes:
      - order-database-data:/var/lib/postgresql/data

    ports:
      - "${ORDER_DB_PORT}:${ORDER_DB_PORT}"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    image: cdc-modernization-demo/order-service:local
    container_name: order-service

    environment:
      SERVER_PORT: ${ORDER_APP_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-database:${ORDER_DB_PORT}/${ORDER_DB}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT:-29092}
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8086

    ports:
      - "${ORDER_APP_PORT}:${ORDER_APP_PORT}"
    depends_on:
      order-database:
        condition: service_healthy

volumes:
  order-database-data: